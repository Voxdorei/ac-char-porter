[project]
name = "azerothcore-character-porter"
version = "0.1.0"
description = "Manual export/import helper for carrying AzerothCore WotLK characters between private servers."
requires-python = ">=3.10"
dependencies = [
    "PyMySQL>=1.1.0",
]

[project.scripts]
acchar = "ac_char_porter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
